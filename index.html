<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spar - Debate Game</title>
  <meta name="description" content="A timed debate game with AI judging.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0d;
      --ink: #f3f0e8;
      --muted: #a8a59b;
      --soft: #d8d0bd;
      --panel: #111416;
      --panel-2: #171b1d;
      --panel-3: #202421;
      --line: #313630;
      --gold: #e0b14d;
      --teal: #40c3a2;
      --violet: #7b6cff;
      --red: #ee7468;
      --blue: #59a7ff;
      --shadow: 0 20px 70px rgba(0, 0, 0, .38);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    #app {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(8, 20, 22, .02), #071822 76%),
        url("assets/spar-arena.png") center top / min(1800px, 150vw) auto no-repeat,
        var(--bg);
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .topbar,
    .matchbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 44px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      font-weight: 850;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(224, 177, 77, .45);
      border-radius: 8px;
      background: rgba(224, 177, 77, .14);
      color: var(--gold);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      background: rgba(10, 12, 12, .46);
      color: var(--soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .setup-grid {
      display: block;
      margin-top: 26px;
    }

    .hero-controls {
      width: min(760px, calc(100% - 28px));
      margin: 18px auto 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 999px;
      background: rgba(181, 187, 190, .88);
      color: #1f2527;
      font-size: 14px;
      font-weight: 760;
    }

    .stage {
      min-height: min(760px, calc(100vh - 96px));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(7, 24, 34, 0) 0%, rgba(7, 24, 34, .12) 38%, rgba(7, 24, 34, .96) 62%),
        url("assets/spar-arena.png") center top / cover no-repeat;
      box-shadow: var(--shadow);
    }

    .stage-copy {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 0 0 20px;
      text-align: center;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .headline {
      max-width: 700px;
      margin: 10px auto 0;
      font-size: clamp(30px, 5vw, 60px);
      line-height: .95;
      letter-spacing: 0;
      font-weight: 900;
    }

    .stage-topic {
      max-width: 680px;
      margin: 18px auto 0;
      color: #fbf22d;
      font-size: clamp(22px, 3.1vw, 42px);
      line-height: 1.12;
      font-weight: 860;
    }

    .setup-panel,
    .game-panel,
    .result-panel {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(17, 20, 22, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .setup-panel {
      width: min(860px, calc(100% - 28px));
      margin: 26px auto 30px;
      padding: 18px;
      background: rgba(160, 170, 172, .9);
      border-color: rgba(255, 255, 255, .48);
      color: #1c2224;
    }

    .setup-panel .panel-title,
    .setup-panel .format-name,
    .setup-panel .topic-text {
      color: #101416;
    }

    .setup-panel .field-label,
    .setup-panel .format-time,
    .setup-panel .tag {
      color: #41494d;
    }

    .setup-panel .tab,
    .setup-panel .choice,
    .setup-panel .format-choice,
    .setup-panel input,
    .setup-panel textarea {
      background: rgba(255, 255, 255, .42);
      border-color: rgba(28, 34, 36, .22);
      color: #101416;
    }

    .setup-panel .tab.active,
    .setup-panel .choice.active,
    .setup-panel .format-choice.active {
      border-color: rgba(251, 242, 45, .9);
      background: rgba(251, 242, 45, .24);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 850;
    }

    .tabs,
    .format-grid,
    .topic-grid,
    .name-grid {
      display: grid;
      gap: 8px;
    }

    .tabs {
      grid-template-columns: 1fr 1fr;
      margin-top: 16px;
    }

    .tab,
    .choice,
    .format-choice {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      color: var(--soft);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .tab {
      font-size: 13px;
      font-weight: 800;
    }

    .tab.active,
    .choice.active,
    .format-choice.active {
      border-color: rgba(224, 177, 77, .78);
      background: rgba(224, 177, 77, .12);
      color: var(--ink);
    }

    .tab:hover,
    .choice:hover,
    .format-choice:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, .24);
    }

    .field-label {
      display: block;
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .topic-grid {
      grid-template-columns: 1fr 1fr;
    }

    .choice {
      min-height: 110px;
      padding: 12px;
      text-align: left;
    }

    .topic-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 3px 7px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .topic-text {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.34;
      font-weight: 760;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .045);
      color: var(--ink);
      outline: 0;
    }

    textarea:focus,
    input:focus {
      border-color: rgba(64, 195, 162, .75);
      box-shadow: 0 0 0 3px rgba(64, 195, 162, .14);
    }

    textarea {
      min-height: 112px;
      padding: 13px;
      resize: vertical;
      line-height: 1.5;
    }

    input {
      height: 44px;
      padding: 0 12px;
    }

    .format-grid {
      grid-template-columns: 1fr 1fr;
    }

    .format-choice {
      padding: 12px;
      text-align: left;
    }

    .format-name {
      display: block;
      color: var(--ink);
      font-size: 14px;
      font-weight: 850;
    }

    .format-time {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .name-grid {
      grid-template-columns: 1fr 1fr;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 850;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, opacity .16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--gold);
      color: #15100a;
    }

    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .045);
      color: var(--ink);
    }

    .btn-danger {
      border: 1px solid rgba(238, 116, 104, .45);
      background: rgba(238, 116, 104, .12);
      color: #ffd4d0;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      margin-top: 22px;
    }

    .game-panel {
      padding: 20px;
    }

    .motion-line {
      margin-top: 14px;
      color: var(--soft);
      font-size: clamp(20px, 3vw, 34px);
      line-height: 1.12;
      font-weight: 880;
    }

    .side-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .side-card {
      min-height: 84px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }

    .side-card.active.aff {
      border-color: rgba(64, 195, 162, .82);
      box-shadow: inset 0 0 0 1px rgba(64, 195, 162, .35);
    }

    .side-card.active.neg {
      border-color: rgba(89, 167, 255, .85);
      box-shadow: inset 0 0 0 1px rgba(89, 167, 255, .35);
    }

    .side-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .side-name {
      margin-top: 5px;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 18px;
      font-weight: 850;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 5px;
      margin-top: 18px;
    }

    .dot {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
    }

    .dot.done { background: rgba(64, 195, 162, .72); }
    .dot.active { background: var(--gold); }

    .turn-card {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      margin-top: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }

    .timer {
      display: grid;
      place-items: center;
      width: 152px;
      height: 152px;
      border-radius: 50%;
    }

    .timer text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 850;
    }

    .turn-title {
      color: var(--ink);
      font-size: 24px;
      line-height: 1.05;
      font-weight: 890;
    }

    .turn-copy {
      margin-top: 9px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .entry {
      margin-top: 16px;
      min-height: 260px;
      font-size: 16px;
    }

    .sidebar {
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .mini-card {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(17, 20, 22, .82);
      padding: 14px;
    }

    .mini-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
    }

    .round-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .round-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .round-item strong {
      color: var(--soft);
      font-weight: 800;
    }

    .judging {
      display: grid;
      place-items: center;
      min-height: 72vh;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, .12);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-panel {
      max-width: 880px;
      margin: 28px auto 0;
      padding: 20px;
    }

    .score-card {
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(9, 11, 13, .2), rgba(9, 11, 13, .92) 54%),
        url("assets/spar-arena.png") center / cover no-repeat;
    }

    .score-inner {
      padding: 28px;
      background: linear-gradient(180deg, rgba(9, 11, 13, .22), rgba(9, 11, 13, .84));
    }

    .share-line {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      color: var(--ink);
      font-size: clamp(23px, 4vw, 42px);
      line-height: 1.05;
      font-weight: 900;
    }

    .winner {
      margin-top: 22px;
      text-align: center;
    }

    .winner-label {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .winner-name {
      margin-top: 5px;
      color: var(--ink);
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      font-weight: 940;
      overflow-wrap: anywhere;
    }

    .verdict {
      max-width: 660px;
      margin: 18px auto 0;
      color: var(--soft);
      text-align: center;
      line-height: 1.55;
    }

    .score-grid {
      display: grid;
      gap: 11px;
      margin-top: 28px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 130px 1fr 52px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }

    .bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
    }

    .bar-aff,
    .bar-neg {
      height: 100%;
    }

    .bar-aff {
      justify-self: end;
      background: var(--teal);
    }

    .bar-neg {
      justify-self: start;
      background: var(--blue);
    }

    .notes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .note {
      min-height: 70px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      color: var(--soft);
      font-size: 13px;
      line-height: 1.45;
    }

    .watermark {
      margin-top: 22px;
      text-align: center;
      color: rgba(243, 240, 232, .66);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .22em;
    }

    .error-box {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(238, 116, 104, .5);
      border-radius: 8px;
      background: rgba(238, 116, 104, .12);
      color: #ffd6d2;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 10;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      min-height: 42px;
      padding: 11px 15px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 8px;
      background: #f3f0e8;
      color: #15100a;
      font-size: 13px;
      font-weight: 850;
      transition: transform .2s ease, opacity .2s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 920px) {
      .setup-grid,
      .game-layout {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 430px;
      }

      .sidebar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 12px;
      }

      .topbar,
      .matchbar,
      .actions {
        align-items: stretch;
      }

      .topbar,
      .matchbar,
      .actions,
      .panel-head {
        flex-direction: column;
      }

      .stage-copy {
        padding: 24px;
      }

      .topic-grid,
      .format-grid,
      .name-grid,
      .side-grid,
      .notes,
      .sidebar {
        grid-template-columns: 1fr;
      }

      .turn-card {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .entry {
        min-height: 220px;
      }

      .score-row {
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "spar.match.v1";

    const MOTIONS = [
      { id: "m1", cat: "Internet", diff: "Easy", text: "Social media does more harm than good." },
      { id: "m2", cat: "School", diff: "Easy", text: "Homework should be banned." },
      { id: "m3", cat: "Money", diff: "Medium", text: "Everyone should receive a universal basic income." },
      { id: "m4", cat: "Climate", diff: "Medium", text: "Nuclear energy should replace fossil fuels faster." },
      { id: "m5", cat: "Culture", diff: "Medium", text: "Influencers should be held to journalist-like standards." },
      { id: "m6", cat: "AI", diff: "Hard", text: "AI companies should be liable for misinformation their tools generate." },
      { id: "m7", cat: "Work", diff: "Easy", text: "A four-day work week should become the default." },
      { id: "m8", cat: "Sports", diff: "Hard", text: "Performance-enhancing drugs should be allowed in professional sports." }
    ];

    const FORMATS = {
      sprint: {
        name: "Sprint",
        time: "6 min",
        durations: { prep: 25, constructive: 40, rebuttal: 30, crossAsk: 15, crossAns: 25, closing: 25 }
      },
      match: {
        name: "Match",
        time: "16 min",
        durations: { prep: 90, constructive: 120, rebuttal: 90, crossAsk: 30, crossAns: 50, closing: 60 }
      }
    };

    const initialState = {
      screen: "setup",
      topicMode: "preset",
      format: "sprint",
      motionId: "m1",
      customTopic: "",
      names: { A: "", B: "" },
      sides: null,
      activeMotionText: "",
      phases: [],
      phaseIndex: 0,
      transcript: {},
      timeLeft: 0,
      paused: false,
      judging: false,
      result: null,
      error: ""
    };

    let state = loadState();
    let timerId = null;

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(initialState);
        const parsed = JSON.parse(raw);
        return { ...structuredClone(initialState), ...parsed, paused: true, judging: false };
      } catch {
        return structuredClone(initialState);
      }
    }

    function saveState() {
      const copy = { ...state, judging: false };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    }

    function clearSavedState() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function fmtTime(total) {
      const safe = Math.max(0, Math.floor(total));
      const mins = Math.floor(safe / 60);
      const secs = String(safe % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function selectedMotionText() {
      if (state.topicMode === "custom") return state.customTopic.trim();
      const motion = MOTIONS.find((item) => item.id === state.motionId) || MOTIONS[0];
      return motion.text;
    }

    function canBegin() {
      return selectedMotionText().length >= 8;
    }

    function buildPhases(d) {
      return [
        { id: "prep-aff", side: "AFF", private: true, label: "Prep", prompt: "Private prep notes.", duration: d.prep },
        { id: "prep-neg", side: "NEG", private: true, label: "Prep", prompt: "Private prep notes.", duration: d.prep },
        { id: "open-aff", side: "AFF", label: "Opening", prompt: "Make the case for the motion.", duration: d.constructive },
        { id: "open-neg", side: "NEG", label: "Opening", prompt: "Make the case against the motion.", duration: d.constructive },
        { id: "reb-aff", side: "AFF", label: "Rebuttal", prompt: "Answer the strongest opposing claims.", duration: d.rebuttal },
        { id: "reb-neg", side: "NEG", label: "Rebuttal", prompt: "Answer the strongest opposing claims.", duration: d.rebuttal },
        { id: "cx-aff-ask", side: "AFF", label: "Cross-ex ask", prompt: "Ask direct questions.", duration: d.crossAsk },
        { id: "cx-neg-ans", side: "NEG", label: "Cross-ex answer", prompt: "Answer directly.", duration: d.crossAns },
        { id: "cx-neg-ask", side: "NEG", label: "Cross-ex ask", prompt: "Ask direct questions.", duration: d.crossAsk },
        { id: "cx-aff-ans", side: "AFF", label: "Cross-ex answer", prompt: "Answer directly.", duration: d.crossAns },
        { id: "close-aff", side: "AFF", label: "Closing", prompt: "Explain why your side wins.", duration: d.closing },
        { id: "close-neg", side: "NEG", label: "Closing", prompt: "Explain why your side wins.", duration: d.closing }
      ];
    }

    function currentPhase() {
      return state.phases[state.phaseIndex];
    }

    function setTopicMode(mode) {
      state.topicMode = mode;
      render();
    }

    function selectMotion(id) {
      state.motionId = id;
      render();
    }

    function setFormat(id) {
      state.format = id;
      render();
    }

    function updateCustomTopic(value) {
      state.customTopic = value;
      renderStageTopic();
      saveState();
      const startButton = document.getElementById("start-button");
      if (startButton) startButton.disabled = !canBegin();
    }

    function updateName(side, value) {
      state.names[side] = value;
      saveState();
    }

    function beginDebate() {
      if (!canBegin()) return;

      const nameA = state.names.A.trim() || "Player 1";
      const nameB = state.names.B.trim() || "Player 2";
      const aIsAff = Math.random() < .5;
      const format = FORMATS[state.format] || FORMATS.sprint;

      state.sides = aIsAff ? { AFF: nameA, NEG: nameB } : { AFF: nameB, NEG: nameA };
      state.activeMotionText = selectedMotionText();
      state.phases = buildPhases(format.durations);
      state.phaseIndex = 0;
      state.transcript = {};
      state.timeLeft = state.phases[0].duration;
      state.paused = false;
      state.result = null;
      state.error = "";
      state.screen = "debate";
      render();
      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      if (state.paused || state.screen !== "debate") return;
      timerId = setInterval(() => {
        state.timeLeft -= 1;
        updateTimerDom();
        if (state.timeLeft % 5 === 0) saveState();
        if (state.timeLeft <= 0) {
          advancePhase();
        }
      }, 1000);
    }

    function updateTimerDom() {
      const phase = currentPhase();
      if (!phase) return;
      const time = document.getElementById("time-left");
      if (time) time.textContent = fmtTime(state.timeLeft);
      const ring = document.getElementById("timer-ring");
      if (ring) {
        const c = 2 * Math.PI * 58;
        const pct = Math.max(0, Math.min(1, state.timeLeft / phase.duration));
        ring.style.strokeDashoffset = String(c * (1 - pct));
      }
    }

    function captureEntry() {
      const phase = currentPhase();
      const input = document.getElementById("entry");
      if (phase && input) state.transcript[phase.id] = input.value;
    }

    function togglePause() {
      captureEntry();
      state.paused = !state.paused;
      render();
      startTimer();
    }

    function advancePhase() {
      captureEntry();
      clearInterval(timerId);
      if (state.phaseIndex < state.phases.length - 1) {
        state.phaseIndex += 1;
        const phase = currentPhase();
        state.timeLeft = phase.duration;
        state.paused = false;
        render();
        startTimer();
      } else {
        state.screen = "judging";
        state.paused = true;
        render();
        runJudging();
      }
    }

    function restart() {
      clearInterval(timerId);
      state = structuredClone(initialState);
      clearSavedState();
      render();
    }

    async function runJudging() {
      if (state.judging) return;
      state.judging = true;
      state.error = "";
      saveState();

      try {
        const response = await fetch("/api/judge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            motion: state.activeMotionText,
            sides: state.sides,
            phases: state.phases,
            transcript: state.transcript
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Judge unavailable.");
        state.result = data.result;
        state.screen = "results";
      } catch (err) {
        state.result = clientDemoJudge();
        state.result.shareLine = `${winnerNameFromResult(state.result)} wins the table.`;
        state.result.verdict = `Demo judge: ${state.result.verdict}`;
        state.screen = "results";
      } finally {
        state.judging = false;
        saveState();
        render();
      }
    }

    function clientDemoJudge() {
      const affText = Object.entries(state.transcript)
        .filter(([key]) => key.includes("aff"))
        .map(([, value]) => String(value || ""))
        .join(" ");
      const negText = Object.entries(state.transcript)
        .filter(([key]) => key.includes("neg"))
        .map(([, value]) => String(value || ""))
        .join(" ");

      const scoreSide = (text) => {
        const words = text.trim().split(/\s+/).filter(Boolean).length;
        const evidence = /\b(data|study|because|for example|evidence|research|percent|survey)\b/i.test(text) ? 2 : 0;
        const clash = /\b(they|opponent|rebut|however|but|therefore|because)\b/i.test(text) ? 1 : 0;
        const base = Math.max(1, Math.min(8, 3 + Math.floor(words / 35) + evidence + clash));
        return {
          logic: base,
          evidence: Math.max(1, base - (evidence ? 1 : 3)),
          rebuttal: Math.max(1, base - 1 + clash),
          crossExamination: Math.max(1, base - 2),
          structure: Math.max(1, base - 1),
          persuasiveness: base,
          notes: words ? "Stronger captured material." : "Very little captured argument."
        };
      };

      const affirmative = scoreSide(affText);
      const negative = scoreSide(negText);
      const total = (side) => ["logic", "evidence", "rebuttal", "crossExamination", "structure", "persuasiveness"]
        .reduce((sum, key) => sum + Number(side[key] || 0), 0);
      const winner = total(affirmative) >= total(negative) ? "affirmative" : "negative";
      const winnerName = winner === "affirmative" ? state.sides.AFF : state.sides.NEG;

      return {
        affirmative,
        negative,
        winner,
        verdict: `${winnerName} wins on the captured record. The edge came from clearer structure and more developed argument work.`,
        shareLine: `${winnerName} wins the table.`
      };
    }

    function winnerNameFromResult(result) {
      if (!state.sides) return "Winner";
      return result.winner === "negative" ? state.sides.NEG : state.sides.AFF;
    }

    function categoryLabel(key) {
      return {
        logic: "Logic",
        evidence: "Evidence",
        rebuttal: "Rebuttal",
        crossExamination: "Cross-ex",
        structure: "Structure",
        persuasiveness: "Persuasion"
      }[key] || key;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1700);
    }

    async function copyResult() {
      if (!state.result) return;
      const winnerSide = state.result.winner === "affirmative" ? "AFF" : "NEG";
      const winnerName = state.sides[winnerSide];
      const text = `${state.result.shareLine}\n\nWinner: ${winnerName}\nTopic: ${state.activeMotionText}\n${state.result.verdict}\n\nSettled on Spar.`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("Copied result");
      } catch {
        showToast("Clipboard blocked");
      }
    }

    function downloadCard() {
      const card = document.getElementById("score-card");
      if (!card || typeof html2canvas === "undefined") {
        showToast("Image export not ready");
        return;
      }
      html2canvas(card, { backgroundColor: "#090b0d", scale: 2 }).then((canvas) => {
        const link = document.createElement("a");
        link.download = "spar-result.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(() => showToast("Could not export image"));
    }

    function renderStageTopic() {
      const node = document.getElementById("stage-topic");
      if (node) node.textContent = selectedMotionText() || "Bring the argument. Spar will keep score.";
    }

    function render() {
      clearInterval(timerId);
      const app = document.getElementById("app");
      if (state.screen === "setup") app.innerHTML = renderSetup();
      if (state.screen === "debate") app.innerHTML = renderDebate();
      if (state.screen === "judging") app.innerHTML = renderJudging();
      if (state.screen === "results") app.innerHTML = renderResults();
      saveState();
      if (state.screen === "debate") {
        updateTimerDom();
        startTimer();
      }
    }

    function renderTopbar(extra = "") {
      return `
        <div class="topbar">
          <div class="brand"><span class="brand-mark">SP</span><span>SPAR</span></div>
          <div class="pill">${extra || "Pass-device debate"}</div>
        </div>
      `;
    }

    function renderSetup() {
      const cards = MOTIONS.map((motion) => `
        <button class="choice ${state.motionId === motion.id ? "active" : ""}" onclick="selectMotion('${motion.id}')">
          <span class="topic-meta"><span class="tag">${esc(motion.cat)}</span><span class="tag">${esc(motion.diff)}</span></span>
          <span class="topic-text">${esc(motion.text)}</span>
        </button>
      `).join("");

      const formatChoices = Object.entries(FORMATS).map(([id, format]) => `
        <button class="format-choice ${state.format === id ? "active" : ""}" onclick="setFormat('${id}')">
          <span class="format-name">${esc(format.name)}</span>
          <span class="format-time">${esc(format.time)}</span>
        </button>
      `).join("");

      return `
        <main class="shell">
          ${renderTopbar("Launch MVP")}
          <section class="setup-grid">
            <div class="stage">
              <div class="stage-copy">
                <div class="kicker">Viral debate</div>
                <p id="stage-topic" class="stage-topic">${esc(selectedMotionText() || "Bring the argument. Spar will keep score.")}</p>
                <div class="hero-controls">
                  <span class="source-chip">SPAR table</span>
                </div>
              </div>
            </div>

            <div class="setup-panel">
              <div class="panel-head">
                <h2 class="panel-title">New table</h2>
                <span class="pill">${esc(FORMATS[state.format].time)}</span>
              </div>

              <div class="tabs">
                <button class="tab ${state.topicMode === "preset" ? "active" : ""}" onclick="setTopicMode('preset')">Topics</button>
                <button class="tab ${state.topicMode === "custom" ? "active" : ""}" onclick="setTopicMode('custom')">Custom</button>
              </div>

              ${state.topicMode === "custom" ? `
                <label class="field-label" for="custom-topic">Motion</label>
                <textarea id="custom-topic" placeholder="This house believes..." oninput="updateCustomTopic(this.value)">${esc(state.customTopic)}</textarea>
              ` : `
                <label class="field-label">Motion</label>
                <div class="topic-grid">${cards}</div>
              `}

              <label class="field-label">Format</label>
              <div class="format-grid">${formatChoices}</div>

              <label class="field-label">Players</label>
              <div class="name-grid">
                <input aria-label="Player 1" placeholder="Player 1" value="${esc(state.names.A)}" oninput="updateName('A', this.value)">
                <input aria-label="Player 2" placeholder="Player 2" value="${esc(state.names.B)}" oninput="updateName('B', this.value)">
              </div>

              <div class="actions">
                <button id="start-button" class="btn btn-primary" ${canBegin() ? "" : "disabled"} onclick="beginDebate()">Assign sides and start</button>
              </div>
            </div>
          </section>
        </main>
      `;
    }

    function renderDebate() {
      const phase = currentPhase();
      const affActive = phase.side === "AFF";
      const sideName = state.sides[phase.side];
      const color = affActive ? "var(--teal)" : "var(--blue)";
      const c = 2 * Math.PI * 58;
      const dots = state.phases.map((_, index) => `<span class="dot ${index < state.phaseIndex ? "done" : index === state.phaseIndex ? "active" : ""}"></span>`).join("");
      const rounds = state.phases.map((item, index) => `
        <div class="round-item">
          <span>${index + 1}. ${esc(item.label)}</span>
          <strong>${esc(item.side === "AFF" ? "For" : "Against")}</strong>
        </div>
      `).join("");

      return `
        <main class="shell">
          ${renderTopbar(`Round ${state.phaseIndex + 1} of ${state.phases.length}`)}
          <section class="game-layout">
            <div class="game-panel">
              <div class="kicker">${esc(FORMATS[state.format].name)} table</div>
              <h1 class="motion-line">${esc(state.activeMotionText)}</h1>

              <div class="side-grid">
                <div class="side-card aff ${affActive ? "active" : ""}">
                  <div class="side-label">For</div>
                  <div class="side-name">${esc(state.sides.AFF)}</div>
                </div>
                <div class="side-card neg ${!affActive ? "active" : ""}">
                  <div class="side-label">Against</div>
                  <div class="side-name">${esc(state.sides.NEG)}</div>
                </div>
              </div>

              <div class="progress">${dots}</div>

              <div class="turn-card">
                <div class="timer">
                  <svg width="152" height="152" viewBox="0 0 132 132" role="img" aria-label="Turn timer">
                    <circle cx="66" cy="66" r="58" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.14)" stroke-width="8"></circle>
                    <circle id="timer-ring" cx="66" cy="66" r="58" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0" transform="rotate(-90 66 66)"></circle>
                    <text id="time-left" x="66" y="74" text-anchor="middle" font-size="28" fill="var(--ink)">${fmtTime(state.timeLeft)}</text>
                  </svg>
                </div>
                <div>
                  <div class="side-label">${esc(phase.side === "AFF" ? "For" : "Against")} - ${esc(sideName)}</div>
                  <h2 class="turn-title">${esc(phase.label)}</h2>
                  <p class="turn-copy">${esc(phase.prompt)} ${phase.private ? "Private round." : ""}</p>
                </div>
              </div>

              <textarea id="entry" class="entry" placeholder="Notes, speech text, or key claims...">${esc(state.transcript[phase.id] || "")}</textarea>

              <div class="actions">
                <button class="btn btn-secondary" onclick="togglePause()">${state.paused ? "Resume" : "Pause"}</button>
                <button class="btn btn-primary" onclick="advancePhase()">${state.phaseIndex === state.phases.length - 1 ? "Send to judge" : "End turn"}</button>
              </div>
            </div>

            <aside class="sidebar">
              <div class="mini-card">
                <div class="mini-title">Table</div>
                <div class="round-list">
                  <div class="round-item"><span>Format</span><strong>${esc(FORMATS[state.format].name)}</strong></div>
                  <div class="round-item"><span>Clock</span><strong>${state.paused ? "Paused" : "Live"}</strong></div>
                  <div class="round-item"><span>Judge</span><strong>Rubric</strong></div>
                </div>
              </div>
              <div class="mini-card">
                <div class="mini-title">Rounds</div>
                <div class="round-list">${rounds}</div>
              </div>
              <button class="btn btn-danger" onclick="restart()">Leave table</button>
            </aside>
          </section>
        </main>
      `;
    }

    function renderJudging() {
      return `
        <main class="shell">
          ${renderTopbar("Judging")}
          <section class="judging">
            <div>
              <div class="spinner" aria-hidden="true"></div>
              <h1 class="motion-line" style="margin-top:22px;">Scoring the table.</h1>
            </div>
          </section>
        </main>
      `;
    }

    function renderResults() {
      if (state.error || !state.result) {
        return `
          <main class="shell">
            ${renderTopbar("Results")}
            <section class="result-panel">
              <div class="kicker">Judge unavailable</div>
              <h1 class="motion-line">${esc(state.activeMotionText || "No motion")}</h1>
              <div class="error-box">${esc(state.error || "No result returned.")}</div>
              <div class="actions">
                <button class="btn btn-primary" onclick="state.screen='judging'; render(); runJudging();">Retry judge</button>
                <button class="btn btn-secondary" onclick="restart()">New table</button>
              </div>
            </section>
          </main>
        `;
      }

      const result = state.result;
      const winnerIsAff = result.winner === "affirmative";
      const winnerName = winnerIsAff ? state.sides.AFF : state.sides.NEG;
      const cats = ["logic", "evidence", "rebuttal", "crossExamination", "structure", "persuasiveness"];
      const rows = cats.map((key) => {
        const aff = Number(result.affirmative[key] || 0);
        const neg = Number(result.negative[key] || 0);
        return `
          <div class="score-row">
            <span>${esc(categoryLabel(key))}</span>
            <span class="bar">
              <span class="bar-aff" style="width:${aff * 10}%"></span>
              <span class="bar-neg" style="width:${neg * 10}%"></span>
            </span>
            <span>${aff}-${neg}</span>
          </div>
        `;
      }).join("");

      return `
        <main class="shell">
          ${renderTopbar("Final card")}
          <section class="result-panel">
            <div id="score-card" class="score-card">
              <div class="score-inner">
                <div class="kicker" style="text-align:center;">${esc(state.activeMotionText)}</div>
                <h1 class="share-line">${esc(result.shareLine)}</h1>
                <div class="winner">
                  <div class="winner-label">${winnerIsAff ? "For wins" : "Against wins"}</div>
                  <div class="winner-name">${esc(winnerName)}</div>
                </div>
                <p class="verdict">${esc(result.verdict)}</p>
                <div class="score-grid">${rows}</div>
                <div class="notes">
                  <div class="note"><strong style="color:var(--teal)">For:</strong> ${esc(result.affirmative.notes || "")}</div>
                  <div class="note"><strong style="color:var(--blue)">Against:</strong> ${esc(result.negative.notes || "")}</div>
                </div>
                <div class="watermark">SPAR</div>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-primary" onclick="downloadCard()">Download card</button>
              <button class="btn btn-secondary" onclick="copyResult()">Copy result</button>
              <button class="btn btn-secondary" onclick="restart()">New table</button>
            </div>
          </section>
        </main>
      `;
    }

    render();
  </script>
</body>
</html>
